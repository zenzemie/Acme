name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript type check
        run: bun tsc --noEmit

      - name: Build production bundle
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python syntax check
        run: |
          python3 -m py_compile scripts/db-migrate.py
          python3 -m py_compile scripts/analyze-code.py
          echo "✓ Python syntax valid"

  shell-checks:
    name: Shell Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          bash -n scripts/setup.sh && echo "✓ setup.sh syntax valid"
          bash -n scripts/check-env.sh && echo "✓ check-env.sh syntax valid"
